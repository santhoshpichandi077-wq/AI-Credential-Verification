<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Certificate Verification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff,
                    #ecfeff
                );

            color: #172033;
        }


        /* =========================
           NAVBAR
           ========================= */

        .verify-nav {

            position: sticky;

            top: 0;

            z-index: 1000;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding: 16px 6%;

            background:
                rgba(255,255,255,.9);

            backdrop-filter:
                blur(15px);

            border-bottom:
                1px solid #e2e8f0;

            box-shadow:
                0 5px 25px
                rgba(15,23,42,.06);
        }


        .brand {

            font-size: 20px;

            font-weight: 900;

            color: #312e81;
        }


        .brand span {

            color: #0891b2;
        }


        .nav-links {

            display: flex;

            gap: 18px;
        }


        .nav-links a {

            text-decoration: none;

            color: #475569;

            font-weight: 700;

            transition: .25s;
        }


        .nav-links a:hover {

            color: #4f46e5;
        }


        /* =========================
           PAGE
           ========================= */

        .page {

            width:
                min(900px, 92%);

            margin:
                45px auto;
        }


        .heading {

            text-align: center;

            animation:
                fadeDown .7s ease;
        }


        .heading h1 {

            margin: 0 0 10px;

            font-size:
                clamp(28px, 5vw, 42px);

            color: #1e1b4b;
        }


        .heading p {

            margin: 0;

            color: #64748b;
        }


        /* =========================
           AI CARD
           ========================= */

        .verify-card {

            position: relative;

            margin-top: 30px;

            padding: 35px;

            border-radius: 25px;

            background:
                rgba(255,255,255,.95);

            border:
                1px solid #e2e8f0;

            box-shadow:
                0 20px 60px
                rgba(15,23,42,.08);

            overflow: hidden;

            animation:
                cardAppear .8s ease;
        }


        .verify-card::before {

            content: "";

            position: absolute;

            width: 230px;

            height: 230px;

            top: -130px;

            right: -100px;

            border-radius: 50%;

            background:
                rgba(99,102,241,.08);
        }


        /* =========================
           AI ICON
           ========================= */

        .ai-icon {

            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 24px;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #cffafe
                );

            box-shadow:
                0 12px 35px
                rgba(79,70,229,.12);

            animation:
                float 3s ease-in-out infinite;
        }


        /* =========================
           UPLOAD AREA
           ========================= */

        .upload-area {

            padding: 35px;

            border-radius: 20px;

            border:
                2px dashed #c7d2fe;

            background:
                #f8faff;

            text-align: center;

            cursor: pointer;

            transition:
                .3s ease;
        }


        .upload-area:hover {

            border-color:
                #6366f1;

            background:
                #eef2ff;

            transform:
                translateY(-3px);
        }


        .upload-icon {

            font-size: 45px;

            margin-bottom: 10px;
        }


        .upload-title {

            font-size: 18px;

            font-weight: 800;

            color: #1e293b;
        }


        .upload-description {

            margin-top: 7px;

            font-size: 13px;

            color: #64748b;
        }


        input[type="file"] {

            display: none;
        }


        .file-name {

            margin-top: 15px;

            color: #4f46e5;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================
           BUTTON
           ========================= */

        .verify-btn {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 15px;

            font-weight: 900;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            box-shadow:
                0 10px 30px
                rgba(79,70,229,.2);

            transition:
                .25s;
        }


        .verify-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 40px
                rgba(79,70,229,.28);
        }


        /* =========================
           SCANNING
           ========================= */

        .scanner {

            display: none;

            margin-top: 25px;

            padding: 25px;

            border-radius: 18px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;

            text-align: center;
        }


        .scanner.active {

            display: block;

            animation:
                fadeIn .4s ease;
        }


        .scan-circle {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            border:
                5px solid #e0e7ff;

            border-top-color:
                #6366f1;

            animation:
                spin 1s linear infinite;
        }


        .scan-title {

            font-weight: 900;

            color: #312e81;
        }


        .scan-text {

            margin-top: 6px;

            font-size: 13px;

            color: #64748b;
        }


        .progress {

            height: 8px;

            margin-top: 18px;

            overflow: hidden;

            border-radius: 20px;

            background:
                #e2e8f0;
        }


        .progress-bar {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #06b6d4
                );

            transition:
                width .5s ease;
        }


        /* =========================
           RESULT
           ========================= */

        .result {

            margin-top: 25px;
        }


        .result-box {

            padding: 25px;

            border-radius: 18px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;

            animation:
                resultIn .6s ease;
        }


        .result-title {

            font-size: 22px;

            font-weight: 900;

            color: #15803d;

            margin-bottom: 15px;
        }


        .result-data {

            padding: 15px;

            border-radius: 12px;

            background: white;

            border:
                1px solid #e2e8f0;

            white-space: pre-wrap;

            color: #334155;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes fadeDown {

            from {
                opacity: 0;
                transform:
                    translateY(-20px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes float {

            0%,100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-8px);
            }
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes resultIn {

            from {
                opacity: 0;
                transform:
                    scale(.94)
                    translateY(15px);
            }

            to {
                opacity: 1;
                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================
           MOBILE
           ========================= */

        @media(max-width: 650px) {

            .verify-nav {

                flex-direction:
                    column;

                gap: 12px;
            }


            .nav-links {

                gap: 12px;

                font-size: 13px;
            }


            .verify-card {

                padding: 20px;
            }


            .upload-area {

                padding: 25px 15px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     NAVIGATION
     ========================= -->

<nav class="verify-nav">

    <div class="brand">
        🤖 AI <span>Digital Credential</span>
    </div>


    <div class="nav-links">

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('certificate') }}">
            Certificate
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</nav>


<!-- =========================
     PAGE
     ========================= -->

<main class="page">


    <section class="heading">

        <h1>
            🤖 AI Certificate Verification
        </h1>

        <p>
            Upload a certificate and verify
            its authenticity using AI.
        </p>

    </section>


    <section class="verify-card">


        <!-- AI ICON -->

        <div class="ai-icon">
            🤖
        </div>


        <!-- =====================
             FORM
             ===================== -->

        <form
            id="verifyForm"
            method="POST"
            action="{{ url_for('ai_verify') }}"
            enctype="multipart/form-data">


            <label
                for="certificate"
                class="upload-area">


                <div class="upload-icon">
                    📄
                </div>


                <div class="upload-title">
                    Upload Certificate
                </div>


                <div class="upload-description">
                    Click here to select PDF,
                    JPG or PNG certificate
                </div>


                <div
                    class="file-name"
                    id="fileName">

                    No file selected

                </div>


            </label>


            <input
                type="file"
                id="certificate"
                name="certificate"
                accept=".pdf,.png,.jpg,.jpeg"
                required>


            <button
                type="submit"
                class="verify-btn"
                id="verifyButton">

                🤖 Start AI Verification

            </button>


        </form>


        <!-- =====================
             SCANNER
             ===================== -->

        <div
            class="scanner"
            id="scanner">


            <div class="scan-circle">
            </div>


            <div
                class="scan-title"
                id="scanTitle">

                AI is scanning certificate...

            </div>


            <div
                class="scan-text"
                id="scanText">

                Preparing verification engine

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar">

                </div>

            </div>


        </div>


        <!-- =====================
             EXISTING RESULT
             ===================== -->

        {% if result %}

        <div class="result">

            <div class="result-box">

                <div class="result-title">

                    ✓ AI Verification Result

                </div>


                <div class="result-data">

                    {{ result }}

                </div>

            </div>

        </div>

        {% endif %}


    </section>


</main>


<script>

    /* =========================
       FILE SELECT
       ========================= */

    const fileInput =
        document.getElementById(
            "certificate"
        );

    const fileName =
        document.getElementById(
            "fileName"
        );


    fileInput.addEventListener(
        "change",
        function () {

            if (this.files.length > 0) {

                fileName.textContent =
                    "✓ " +
                    this.files[0].name;

            } else {

                fileName.textContent =
                    "No file selected";
            }

        }
    );


    /* =========================
       AI SCANNING
       ========================= */

    const form =
        document.getElementById(
            "verifyForm"
        );

    const scanner =
        document.getElementById(
            "scanner"
        );

    const progress =
        document.getElementById(
            "progressBar"
        );

    const scanTitle =
        document.getElementById(
            "scanTitle"
        );

    const scanText =
        document.getElementById(
            "scanText"
        );

    const verifyButton =
        document.getElementById(
            "verifyButton"
        );


    form.addEventListener(
        "submit",
        function () {

            scanner.classList.add(
                "active"
            );


            verifyButton.disabled =
                true;


            verifyButton.textContent =
                "🤖 AI Processing...";


            const steps = [

                {
                    progress: 20,
                    title:
                        "AI is scanning certificate...",
                    text:
                        "Reading certificate structure"
                },

                {
                    progress: 40,
                    title:
                        "Extracting certificate text...",
                    text:
                        "Analyzing certificate content"
                },

                {
                    progress: 60,
                    title:
                        "Detecting credential ID...",
                    text:
                        "Searching for digital credential"
                },

                {
                    progress: 80,
                    title:
                        "Checking verification database...",
                    text:
                        "Validating credential information"
                },

                {
                    progress: 100,
                    title:
                        "Verification completed...",
                    text:
                        "Generating verification result"
                }

            ];


            let index = 0;


            const interval =
                setInterval(
                    function () {

                        if (
                            index >=
                            steps.length
                        ) {

                            clearInterval(
                                interval
                            );

                            return;
                        }


                        const step =
                            steps[index];


                        progress.style.width =
                            step.progress + "%";


                        scanTitle.textContent =
                            step.title;


                        scanText.textContent =
                            step.text;


                        index++;

                    },
                    700
                );

        }
    );

</script>


</body>

</html>
